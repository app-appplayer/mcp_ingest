name: mcp_ingest
description: Convert any file format to standardized document structure for the MCP knowledge system.
version: 0.1.0
homepage: https://app-appplayer.github.io/makemind
repository: https://github.com/app-appplayer/mcp_ingest
issue_tracker: https://github.com/app-appplayer/mcp_ingest/issues

topics:
  - ingest
  - mcp
  - document
  - parsing
  - normalization

environment:
  sdk: ^3.0.0

dependencies:
  # MCP Ecosystem
  mcp_fact_graph: ^0.2.0
  mcp_bundle: ^0.3.0

  # Core utilities
  uuid: ^4.0.0
  crypto: ^3.0.0
  mime: ^1.0.0
  path: ^1.8.0

  # Parsing
  html: ^0.15.0
  xml: ^6.0.0
  yaml: ^3.0.0
  archive: ^3.0.0
  markdown: ^7.0.0

  # Async utilities
  async: ^2.11.0
  pool: ^1.5.0
  stream_transform: ^2.1.0

dev_dependencies:
  test: ^1.24.0
  mocktail: ^1.0.0
  lints: ^3.0.0
