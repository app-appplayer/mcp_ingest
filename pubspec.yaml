name: mcp_ingest
description: Convert any file format to standardized document structure for the MCP knowledge system.
version: 0.2.0
homepage: https://app-appplayer.github.io/makemind
repository: https://github.com/app-appplayer/mcp_ingest
issue_tracker: https://github.com/app-appplayer/mcp_ingest/issues

topics:
  - ingest
  - mcp
  - document
  - parsing
  - normalization

environment:
  sdk: ^3.0.0

dependencies:
  # MCP Ecosystem
  mcp_fact_graph: ^0.3.0
  mcp_bundle: ^0.4.14

  # Core utilities
  uuid: ^4.6.0
  crypto: ^3.0.8
  path: ^1.8.0

  # Parsing
  html: ^0.15.7
  xml: ^6.6.1
  yaml: ^3.1.4
  archive: ">=3.6.1 <5.0.0"
  markdown: ^7.3.1

  # Async utilities
  async: ^2.13.1
  pool: ^1.5.3
  stream_transform: ^2.1.2

dev_dependencies:
  test: ^1.24.0
  mocktail: ^1.0.0
  lints: ^3.0.0
